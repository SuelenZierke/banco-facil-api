# .gitleaks.toml
# Allowlist para chaves de EXEMPLO publicas e inofensivas presentes no
# historico do repositorio (commit df279d8 — AppConfig.java original).
#
# Estrategia: ignorar o arquivo AppConfig.java inteiramente no scan do Gitleaks,
# pois ele so existe no historico (o arquivo atual ja foi corrigido para usar
# System.getenv). Os valores presentes no historico sao chaves de demonstracao
# publicas — nao ha credencial real a revogar.
#
# Usamos paths em vez de regexes com os valores das chaves para evitar que o
# proprio arquivo de configuracao seja detectado pelo Semgrep ou por outros
# scanners que varrem o conteudo dos arquivos.

title = "banco-facil-api gitleaks config"

[allowlist]
  description = "Ignora AppConfig.java do historico — chaves de exemplo publicas e inofensivas"
  paths = [
    "src/main/java/com/unifebe/devsecops/config/AppConfig.java",
  ]
